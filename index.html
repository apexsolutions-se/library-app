<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 50px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* =====================================
       HOME
    ===================================== */

    .home-header {
      text-align: center;
      margin-top: 50px;
      margin-bottom: 45px;
    }

    .home-icon {
      font-size: 58px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .subtitle {
      color: #777;
      margin-top: 8px;
    }

    .home-button {
      width: 100%;
      min-height: 110px;
      border-radius: 22px;
      margin-bottom: 18px;
      border: none;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .borrow-home {
      background: #1f4e78;
      color: white;
    }

    .return-home {
      background: white;
      color: #1f4e78;
      border: 2px solid #1f4e78;
    }

    /* =====================================
       GENERAL
    ===================================== */

    .topbar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-button {
      background: transparent;
      border: none;
      color: #1f4e78;
      font-size: 16px;
      padding: 5px 0;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    button {
      font-family: inherit;
    }

    .button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1f4e78;
      color: white;
    }

    .dark {
      background: #111;
      color: white;
    }

    .secondary {
      background: #eef3f7;
      color: #1f4e78;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    /* =====================================
       TAP CARD STATE
    ===================================== */

    .tap-card {
      padding: 35px 20px;
      margin-top: 20px;
      border: 2px dashed #1f4e78;
      border-radius: 18px;
      text-align: center;
      background: #f6f9fc;
      cursor: pointer;
    }

    .tap-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .tap-title {
      font-size: 20px;
      font-weight: bold;
      color: #1f4e78;
    }

    .tap-help {
      font-size: 13px;
      color: #777;
      margin-top: 7px;
      line-height: 1.4;
    }

    /* =====================================
       STATUS
    ===================================== */

    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eee;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      background: #e7f6eb !important;
      color: #176c2e;
    }

    .error {
      background: #fdeaea !important;
      color: #a22121;
    }

    .loading {
      background: #fff4d6 !important;
      color: #755700;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 7px;
      border: 2px solid rgba(0,0,0,.15);
      border-top-color: #755700;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================
       STUDENT
    ===================================== */

    #newStudentBox,
    #studentFoundBox,
    #borrowBox,
    #scannerBox {
      display: none;
    }

    .student-name {
      font-size: 23px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    /* =====================================
       BARCODE CAMERA
    ===================================== */

    .scanner {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-top: 15px;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #barcodeCamera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scan-area {
      position: absolute;
      width: 88%;
      height: 35%;
      left: 6%;
      top: 32.5%;
      border: 3px solid white;
      border-radius: 12px;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      background: white;
    }

    .scanner-text {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      color: white;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 1px 4px #000;
    }

  </style>

</head>


<body>

<div class="app">

  <!-- =====================================
       HOME SCREEN
  ====================================== -->

  <div
    id="homeScreen"
    class="screen active"
  >

    <div class="home-header">

      <div class="home-icon">
        📚
      </div>

      <h1>Library</h1>

      <div class="subtitle">
        Borrow & Return System
      </div>

    </div>


    <button
      class="home-button borrow-home"
      onclick="openBorrow()"
    >
      📖 Borrow Book
    </button>


    <button
      class="home-button return-home"
      onclick="openReturn()"
    >
      ↩️ Return Book
    </button>

  </div>



  <!-- =====================================
       BORROW SCREEN
  ====================================== -->

  <div
    id="borrowScreen"
    class="screen"
  >

    <div class="topbar">

      <button
        class="back-button"
        onclick="goHome()"
      >
        ← Home
      </button>

    </div>


    <div class="card">

      <h2>Borrow Book</h2>


      <!-- WAITING FOR STUDENT -->

      <div
        id="tapCardBox"
        class="tap-card"
        onclick="scanNfc()"
      >

        <div class="tap-icon">
          📡
        </div>

        <div class="tap-title">
          Tap Student Card
        </div>

        <div class="tap-help">
          Hold the student's card against
          the back of the phone.
        </div>

      </div>


      <div id="status">
        Ready.
      </div>



      <!-- NEW STUDENT -->

      <div id="newStudentBox">

        <label>
          New Student
        </label>

        <div class="small">
          Enter the student's name once.
          Their card will be remembered next time.
        </div>

        <input
          id="newStudentName"
          type="text"
          autocomplete="off"
          placeholder="Student name"
        >

        <button
          class="button dark"
          onclick="saveNewStudent()"
        >
          Save Student
        </button>

      </div>



      <!-- FOUND STUDENT -->

      <div id="studentFoundBox">

        <label>
          Student
        </label>

        <div
          id="displayStudentName"
          class="student-name"
        ></div>

      </div>



      <!-- BOOK -->

      <div id="borrowBox">

        <button
          class="button dark"
          onclick="startBarcodeScanner()"
        >
          📷 Scan Book Barcode
        </button>


        <div id="scannerBox">

          <div class="scanner">

            <video
              id="barcodeCamera"
              autoplay
              playsinline
              muted
            ></video>


            <div class="scanner-overlay">

              <div class="scan-area"></div>

              <div class="scan-line"></div>

              <div class="scanner-text">
                Align book barcode inside the box
              </div>

            </div>

          </div>


          <button
            class="button secondary"
            onclick="stopBarcodeScanner()"
          >
            Cancel Scanner
          </button>

        </div>


        <label for="bookBarcode">
          Barcode / ISBN
        </label>

        <input
          id="bookBarcode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Barcode will appear here"
        >


        <button
          id="borrowButton"
          class="button primary"
          onclick="borrowBook()"
        >
          Borrow Book
        </button>

      </div>

    </div>

  </div>



  <!-- =====================================
       RETURN SCREEN
  ====================================== -->

  <div
    id="returnScreen"
    class="screen"
  >

    <div class="topbar">

      <button
        class="back-button"
        onclick="goHome()"
      >
        ← Home
      </button>

    </div>


    <div class="card">

      <h2>Return Book</h2>

      <p class="small">
        We'll connect the return barcode
        scanner next.
      </p>

      <button
        class="button dark"
        onclick="alert('Return scanner is our next step!')"
      >
        📷 Scan Book to Return
      </button>

    </div>

  </div>

</div>


<script>

/* ==========================================
   CONFIG
========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbz-ytfnzaoduBeY-xEg5muZXU9RRaa0GRrq7sROsFiHWVPcUzcwyZOAmRciPCRK0FOQ/exec";


let nfcReader = null;
let nfcStarted = false;
let processingCard = false;

let currentSerial = null;

let barcodeStream = null;
let barcodeDetector = null;
let scanningBarcode = false;
let lastDetectedBarcode = null;


/* ==========================================
   NAVIGATION
========================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(
      screen =>
        screen.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");

}


function openBorrow() {

  showScreen("borrowScreen");

  resetBorrowScreen();

}


function openReturn() {

  stopBarcodeScanner();

  showScreen("returnScreen");

}


function goHome() {

  stopBarcodeScanner();

  currentSerial = null;

  showScreen("homeScreen");

}


/* ==========================================
   NFC
========================================== */

async function scanNfc() {

  const status =
    document.getElementById("status");


  if (!("NDEFReader" in window)) {

    showError(
      "NFC scanning is not supported on this browser."
    );

    return;
  }


  /*
    Reader is already running.
    Just wait for the next card.
  */

  if (nfcStarted) {

    status.className = "";

    status.innerHTML =
      "📡 Waiting for student card...";

    return;
  }


  try {

    status.className =
      "loading";

    status.innerHTML =
      '<span class="spinner"></span>Starting card reader...';


    nfcReader =
      new NDEFReader();


    await nfcReader.scan();


    nfcStarted =
      true;


    status.className = "";

    status.innerHTML =
      "📡 Waiting for student card...";


    nfcReader.addEventListener(
      "reading",
      async event => {

        /*
          Ignore NFC while not on
          the Borrow screen.
        */

        if (
          !document
            .getElementById("borrowScreen")
            .classList.contains("active")
        ) {
          return;
        }


        if (
          processingCard ||
          currentSerial
        ) {
          return;
        }


        processingCard =
          true;


        try {

          const serial =
            event.serialNumber;


          if (!serial) {

            showError(
              "Card detected but no serial number was available."
            );

            return;
          }


          currentSerial =
            serial;


          status.className =
            "loading";


          status.innerHTML =
            '<span class="spinner"></span>Finding student...';


          await lookupStudent();

        }

        catch (error) {

          currentSerial = null;

          showError(
            error.message
          );

        }

        finally {

          setTimeout(
            () => {
              processingCard = false;
            },
            600
          );

        }

      }
    );


    nfcReader.addEventListener(
      "readingerror",
      function() {

        showError(
          "Card detected but couldn't be read. Try again."
        );

      }
    );

  }

  catch (error) {

    nfcStarted =
      false;

    nfcReader =
      null;


    showError(
      error.message
    );

  }

}


/* ==========================================
   STUDENT LOOKUP
========================================== */

async function lookupStudent() {

  try {

    const result =
      await apiRequest({

        action:
          "findStudent",

        serialNumber:
          currentSerial

      });


    if (result.found) {

      showStudent(
        result.studentName
      );

    }

    else {

      document
        .getElementById("tapCardBox")
        .style.display =
          "none";


      document
        .getElementById("newStudentBox")
        .style.display =
          "block";


      document
        .getElementById("studentFoundBox")
        .style.display =
          "none";


      document
        .getElementById("borrowBox")
        .style.display =
          "none";


      const status =
        document.getElementById("status");


      status.className = "";

      status.innerHTML =
        "🆕 New card detected";


      document
        .getElementById("newStudentName")
        .focus();

    }

  }

  catch (error) {

    currentSerial =
      null;


    showError(
      error.message
    );

  }

}


/* ==========================================
   NEW STUDENT
========================================== */

async function saveNewStudent() {

  const name =
    document
      .getElementById("newStudentName")
      .value
      .trim();


  if (!name) {

    showError(
      "Enter the student's name."
    );

    return;
  }


  const status =
    document.getElementById("status");


  try {

    status.className =
      "loading";


    status.innerHTML =
      '<span class="spinner"></span>Saving student...';


    const result =
      await apiRequest({

        action:
          "registerStudent",

        serialNumber:
          currentSerial,

        studentName:
          name

      });


    document
      .getElementById("newStudentName")
      .value =
        "";


    showStudent(
      result.studentName
    );

  }

  catch (error) {

    showError(
      error.message
    );

  }

}


/* ==========================================
   STUDENT FOUND
========================================== */

function showStudent(name) {

  document
    .getElementById("tapCardBox")
    .style.display =
      "none";


  document
    .getElementById("newStudentBox")
    .style.display =
      "none";


  document
    .getElementById("studentFoundBox")
    .style.display =
      "block";


  document
    .getElementById("borrowBox")
    .style.display =
      "block";


  document
    .getElementById("displayStudentName")
    .innerText =
      name;


  const status =
    document.getElementById("status");


  status.className =
    "success";


  status.innerHTML =
    "✓ " +
    escapeHtml(name);


  setTimeout(
    startBarcodeScanner,
    350
  );

}


/* ==========================================
   BARCODE CAMERA
========================================== */

async function startBarcodeScanner() {

  if (!currentSerial) {
    return;
  }


  if (!("BarcodeDetector" in window)) {

    showError(
      "Automatic barcode scanning isn't supported. Enter the barcode manually."
    );

    return;
  }


  try {

    stopBarcodeScanner();


    const supportedFormats =
      await BarcodeDetector
        .getSupportedFormats();


    const desiredFormats = [
      "ean_13",
      "ean_8",
      "code_128",
      "code_39",
      "upc_a",
      "upc_e"
    ];


    const formats =
      desiredFormats.filter(
        format =>
          supportedFormats.includes(format)
      );


    barcodeDetector =
      new BarcodeDetector({

        formats:
          formats.length
            ? formats
            : supportedFormats

      });


    barcodeStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "barcodeCamera"
      );


    video.srcObject =
      barcodeStream;


    await video.play();


    document
      .getElementById("scannerBox")
      .style.display =
        "block";


    scanningBarcode =
      true;


    lastDetectedBarcode =
      null;


    const status =
      document.getElementById("status");


    status.className = "";

    status.innerHTML =
      "📷 Scan the book barcode";


    scanBarcodeFrame();

  }

  catch (error) {

    stopBarcodeScanner();

    showError(
      "Could not start camera: " +
      error.message
    );

  }

}


async function scanBarcodeFrame() {

  if (
    !scanningBarcode ||
    !barcodeDetector
  ) {
    return;
  }


  const video =
    document.getElementById(
      "barcodeCamera"
    );


  try {

    if (video.readyState >= 2) {

      const barcodes =
        await barcodeDetector.detect(
          video
        );


      if (
        barcodes &&
        barcodes.length
      ) {

        const value =
          String(
            barcodes[0].rawValue || ""
          ).trim();


        if (
          value &&
          value !== lastDetectedBarcode
        ) {

          lastDetectedBarcode =
            value;


          barcodeDetected(
            value
          );


          return;

        }

      }

    }

  }

  catch (error) {

    console.log(
      "Barcode frame error:",
      error
    );

  }


  if (scanningBarcode) {

    requestAnimationFrame(
      scanBarcodeFrame
    );

  }

}


function barcodeDetected(value) {

  stopBarcodeScanner();


  document
    .getElementById("bookBarcode")
    .value =
      value;


  const status =
    document.getElementById("status");


  status.className =
    "success";


  status.innerHTML =
    "✓ Barcode scanned";


  if ("vibrate" in navigator) {

    navigator.vibrate(100);

  }

}


function stopBarcodeScanner() {

  scanningBarcode =
    false;


  if (barcodeStream) {

    barcodeStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    barcodeStream =
      null;

  }


  const video =
    document.getElementById(
      "barcodeCamera"
    );


  if (video) {

    video.srcObject =
      null;

  }


  const scannerBox =
    document.getElementById(
      "scannerBox"
    );


  if (scannerBox) {

    scannerBox.style.display =
      "none";

  }

}


/* ==========================================
   BORROW
========================================== */

async function borrowBook() {

  const barcode =
    document
      .getElementById("bookBarcode")
      .value
      .trim();


  if (!currentSerial) {

    showError(
      "Tap a student card first."
    );

    return;
  }


  if (!barcode) {

    showError(
      "Scan a book barcode first."
    );

    return;
  }


  const button =
    document.getElementById(
      "borrowButton"
    );


  const status =
    document.getElementById("status");


  try {

    button.disabled =
      true;


    stopBarcodeScanner();


    /*
      THIS is the loading message while
      Google Books / Open Library is searched.
    */

    status.className =
      "loading";


    status.innerHTML =
      '<span class="spinner"></span>' +
      'Looking up book details...';


    const result =
      await apiRequest({

        action:
          "borrowBook",

        serialNumber:
          currentSerial,

        bookBarcode:
          barcode

      });


    if (!result.success) {

      throw new Error(
        result.error ||
        "Borrowing failed."
      );

    }


    status.className =
      "success";


    status.innerHTML =
      "✅ <strong>Borrowed!</strong>" +
      "<br>" +
      escapeHtml(result.studentName) +
      "<br>" +
      escapeHtml(result.bookTitle || "Book") +
      "<br>" +
      "Due: " +
      escapeHtml(result.dueDate);


    if ("vibrate" in navigator) {

      navigator.vibrate(
        [100, 60, 100]
      );

    }


    /*
      Leave success visible briefly,
      then return to clean Tap Student Card.
    */

    setTimeout(
      resetBorrowScreen,
      1800
    );

  }

  catch (error) {

    showError(
      error.message
    );

  }

  finally {

    button.disabled =
      false;

  }

}


/* ==========================================
   RESET BORROW SCREEN
========================================== */

function resetBorrowScreen() {

  stopBarcodeScanner();


  currentSerial =
    null;


  lastDetectedBarcode =
    null;


  document
    .getElementById("bookBarcode")
    .value =
      "";


  document
    .getElementById("newStudentName")
    .value =
      "";


  document
    .getElementById("displayStudentName")
    .innerText =
      "";


  document
    .getElementById("newStudentBox")
    .style.display =
      "none";


  document
    .getElementById("studentFoundBox")
    .style.display =
      "none";


  document
    .getElementById("borrowBox")
    .style.display =
      "none";


  document
    .getElementById("tapCardBox")
    .style.display =
      "block";


  const status =
    document.getElementById("status");


  status.className = "";

  status.innerHTML =
    nfcStarted
      ? "Ready for student card."
      : "Tap above to start.";

}


/* ==========================================
   API
========================================== */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      "Server error: " +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    result.success === false &&
    result.error
  ) {

    throw new Error(
      result.error
    );

  }


  return result;

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  const status =
    document.getElementById("status");


  status.className =
    "error";


  status.innerHTML =
    "❌ " +
    escapeHtml(message);

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

  return String(
    value || ""
  )

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
