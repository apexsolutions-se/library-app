<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 24px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1f4e78;
      color: white;
    }

    .dark {
      background: #111;
      color: white;
    }

    .secondary {
      background: #eef3f7;
      color: #1f4e78;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: #eee;
      line-height: 1.5;
    }

    #newStudentBox,
    #studentFoundBox,
    #borrowBox,
    #scannerBox {
      display: none;
    }

    .success {
      background: #e7f6eb !important;
      color: #176c2e;
    }

    .error {
      background: #fdeaea !important;
      color: #a22121;
    }

    /* ==========================================
       BARCODE CAMERA
    ========================================== */

    .scanner {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-top: 15px;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #barcodeCamera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scan-area {
      position: absolute;
      width: 88%;
      height: 35%;
      left: 6%;
      top: 32.5%;
      border: 3px solid white;
      border-radius: 12px;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      background: white;
      opacity: .8;
    }

    .scanner-text {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-weight: bold;
      text-shadow: 0 1px 4px black;
    }

    .student-name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

  </style>
</head>


<body>

<div class="app">

  <h1>📚 Library</h1>


  <div class="card">

    <h2>Borrow Book</h2>


    <!-- NFC -->

    <button
      id="nfcButton"
      class="primary"
      onclick="scanNfc()">

      📡 Tap Student Card

    </button>


    <div id="status">
      Ready for student card.
    </div>



    <!-- NEW STUDENT -->

    <div id="newStudentBox">

      <label>
        New Student
      </label>

      <div class="small">
        This card hasn't been registered before.
        Enter the student's name once.
      </div>

      <input
        id="newStudentName"
        type="text"
        autocomplete="off"
        placeholder="Student name"
      >

      <button
        class="dark"
        onclick="saveNewStudent()">

        Save Student

      </button>

    </div>



    <!-- FOUND STUDENT -->

    <div id="studentFoundBox">

      <label>
        Student
      </label>

      <div
        id="displayStudentName"
        class="student-name">
      </div>

    </div>



    <!-- BORROW SECTION -->

    <div id="borrowBox">

      <label>
        Book
      </label>


      <button
        class="dark"
        onclick="startBarcodeScanner()">

        📷 Scan Book Barcode

      </button>



      <!-- CAMERA -->

      <div id="scannerBox">

        <div class="scanner">

          <video
            id="barcodeCamera"
            autoplay
            playsinline
            muted>
          </video>


          <div class="scanner-overlay">

            <div class="scan-area"></div>

            <div class="scan-line"></div>

            <div class="scanner-text">
              Align barcode inside the box
            </div>

          </div>

        </div>


        <button
          class="secondary"
          onclick="stopBarcodeScanner()">

          Cancel Scanner

        </button>

      </div>



      <!-- BARCODE VALUE -->

      <label for="bookBarcode">
        Barcode / ISBN
      </label>

      <input
        id="bookBarcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Barcode will appear here"
      >


      <button
        id="borrowButton"
        class="primary"
        onclick="borrowBook()">

        Borrow Book

      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbz-ytfnzaoduBeY-xEg5muZXU9RRaa0GRrq7sROsFiHWVPcUzcwyZOAmRciPCRK0FOQ/exec";

let nfcReader = null;
let nfcStarted = false;
let processingCard = false;

let currentSerial = null;

let barcodeStream = null;
let barcodeDetector = null;
let scanningBarcode = false;
let lastDetectedBarcode = null;


/* =====================================================
   NFC
===================================================== */

async function scanNfc() {

  const status =
    document.getElementById("status");


  if (!("NDEFReader" in window)) {

    showError(
      "NFC scanning is not supported on this browser."
    );

    return;
  }


  /*
    If NFC is already active,
    do not start a second reader.
  */

  if (nfcStarted) {

    status.className = "";

    status.innerHTML =
      "📡 Ready. Tap the next student's card.";

    return;
  }


  try {

    nfcReader =
      new NDEFReader();


    await nfcReader.scan();


    nfcStarted = true;


    document
      .getElementById("nfcButton")
      .innerText =
        "📡 NFC Reader Active";


    status.className = "";

    status.innerHTML =
      "📡 Ready. Tap the student's card.";


    /*
      This listener stays running for the
      entire checkout session.
    */

    nfcReader.addEventListener(
      "reading",
      async event => {

        /*
          Don't process a second NFC event
          while we're already handling one.
        */

        if (processingCard) {
          return;
        }


        /*
          If a student is already active,
          ignore accidental extra NFC reads.
        */

        if (currentSerial) {
          return;
        }


        processingCard = true;


        try {

          const serial =
            event.serialNumber;


          if (!serial) {

            showError(
              "Card detected, but no serial number was available."
            );

            return;
          }


          currentSerial =
            serial;


          status.className = "";

          status.innerHTML =
            "Card detected. Looking up student...";


          await lookupStudent();

        }

        catch (error) {

          currentSerial = null;

          showError(
            error.message
          );

        }

        finally {

          setTimeout(
            function() {
              processingCard = false;
            },
            700
          );

        }

      }
    );


    nfcReader.addEventListener(
      "readingerror",
      function() {

        status.className =
          "error";

        status.innerHTML =
          "⚠️ Card detected, but it couldn't be read. Try again.";

      }
    );

  }

  catch (error) {

    nfcStarted = false;
    nfcReader = null;

    showError(
      error.message
    );

  }

}


/* =====================================================
   LOOK UP STUDENT
===================================================== */

async function lookupStudent() {

  try {

    const result =
      await apiRequest({

        action:
          "findStudent",

        serialNumber:
          currentSerial

      });


    if (result.found) {

      showStudent(
        result.studentName
      );

    }

    else {

      document
        .getElementById("newStudentBox")
        .style.display =
          "block";


      document
        .getElementById("studentFoundBox")
        .style.display =
          "none";


      document
        .getElementById("borrowBox")
        .style.display =
          "none";


      const status =
        document.getElementById("status");


      status.className = "";

      status.innerHTML =
        "🆕 New card. Enter the student's name once.";


      document
        .getElementById("newStudentName")
        .focus();

    }

  }

  catch (error) {

    currentSerial = null;

    showError(
      error.message
    );

  }

}


/* =====================================================
   REGISTER NEW STUDENT
===================================================== */

async function saveNewStudent() {

  const name =
    document
      .getElementById("newStudentName")
      .value
      .trim();


  if (!name) {

    showError(
      "Enter the student's name."
    );

    return;
  }


  try {

    const status =
      document.getElementById("status");


    status.className = "";

    status.innerHTML =
      "Saving student...";


    const result =
      await apiRequest({

        action:
          "registerStudent",

        serialNumber:
          currentSerial,

        studentName:
          name

      });


    document
      .getElementById("newStudentName")
      .value = "";


    showStudent(
      result.studentName
    );

  }

  catch (error) {

    showError(
      error.message
    );

  }

}


/* =====================================================
   SHOW STUDENT
===================================================== */

function showStudent(name) {

  document
    .getElementById("newStudentBox")
    .style.display =
      "none";


  document
    .getElementById("studentFoundBox")
    .style.display =
      "block";


  document
    .getElementById("borrowBox")
    .style.display =
      "block";


  document
    .getElementById("displayStudentName")
    .innerText =
      name;


  const status =
    document.getElementById("status");


  status.className =
    "success";


  status.innerHTML =
    "✓ Student identified: <strong>" +
    escapeHtml(name) +
    "</strong>";


  /*
    Automatically open the book scanner.
  */

  setTimeout(
    startBarcodeScanner,
    350
  );

}


/* =====================================================
   START BARCODE SCANNER
===================================================== */

async function startBarcodeScanner() {

  const status =
    document.getElementById("status");


  if (!currentSerial) {

    showError(
      "Scan a student card first."
    );

    return;
  }


  if (!("BarcodeDetector" in window)) {

    showError(
      "Automatic barcode scanning isn't supported by this browser. You can still enter the barcode manually."
    );

    return;
  }


  try {

    stopBarcodeScanner();


    const supportedFormats =
      await BarcodeDetector
        .getSupportedFormats();


    console.log(
      "Supported barcode formats:",
      supportedFormats
    );


    const desiredFormats = [
      "ean_13",
      "ean_8",
      "code_128",
      "code_39",
      "upc_a",
      "upc_e"
    ];


    const formats =
      desiredFormats.filter(
        format =>
          supportedFormats.includes(format)
      );


    barcodeDetector =
      new BarcodeDetector({

        formats:
          formats.length
            ? formats
            : supportedFormats

      });


    barcodeStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "barcodeCamera"
      );


    video.srcObject =
      barcodeStream;


    await video.play();


    document
      .getElementById("scannerBox")
      .style.display =
        "block";


    scanningBarcode =
      true;


    lastDetectedBarcode =
      null;


    status.className = "";

    status.innerHTML =
      "📷 Point the camera at the book barcode.";


    scanBarcodeFrame();

  }

  catch (error) {

    console.error(error);

    stopBarcodeScanner();

    showError(
      "Could not start barcode scanner: " +
      error.message
    );

  }

}


/* =====================================================
   CONTINUOUS BARCODE DETECTION
===================================================== */

async function scanBarcodeFrame() {

  if (
    !scanningBarcode ||
    !barcodeDetector
  ) {
    return;
  }


  const video =
    document.getElementById(
      "barcodeCamera"
    );


  try {

    if (video.readyState >= 2) {

      const barcodes =
        await barcodeDetector.detect(
          video
        );


      if (
        barcodes &&
        barcodes.length > 0
      ) {

        const barcode =
          barcodes[0];


        const value =
          String(
            barcode.rawValue || ""
          ).trim();


        if (
          value &&
          value !== lastDetectedBarcode
        ) {

          lastDetectedBarcode =
            value;


          barcodeDetected(
            value
          );


          return;

        }

      }

    }

  }

  catch (error) {

    console.log(
      "Barcode detection frame error:",
      error
    );

  }


  if (scanningBarcode) {

    requestAnimationFrame(
      scanBarcodeFrame
    );

  }

}


/* =====================================================
   BARCODE FOUND
===================================================== */

function barcodeDetected(value) {

  stopBarcodeScanner();


  document
    .getElementById("bookBarcode")
    .value =
      value;


  const status =
    document.getElementById("status");


  status.className =
    "success";


  status.innerHTML =
    "✓ Book barcode scanned" +
    "<br><strong>" +
    escapeHtml(value) +
    "</strong>";


  if ("vibrate" in navigator) {

    navigator.vibrate(100);

  }

}


/* =====================================================
   STOP BARCODE SCANNER
===================================================== */

function stopBarcodeScanner() {

  scanningBarcode =
    false;


  if (barcodeStream) {

    barcodeStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    barcodeStream =
      null;

  }


  const video =
    document.getElementById(
      "barcodeCamera"
    );


  if (video) {

    video.srcObject =
      null;

  }


  const scannerBox =
    document.getElementById(
      "scannerBox"
    );


  if (scannerBox) {

    scannerBox.style.display =
      "none";

  }

}


/* =====================================================
   BORROW BOOK
===================================================== */

async function borrowBook() {

  const barcode =
    document
      .getElementById("bookBarcode")
      .value
      .trim();


  if (!currentSerial) {

    showError(
      "Scan a student card first."
    );

    return;
  }


  if (!barcode) {

    showError(
      "Scan the book barcode first."
    );

    return;
  }


  const borrowButton =
    document.getElementById(
      "borrowButton"
    );


  try {

    /*
      Prevent double-clicks.
    */

    if (borrowButton) {
      borrowButton.disabled = true;
    }


    stopBarcodeScanner();


    const status =
      document.getElementById("status");


    status.className = "";

    status.innerHTML =
      "Saving borrowing transaction...";


    const result =
      await apiRequest({

        action:
          "borrowBook",

        serialNumber:
          currentSerial,

        bookBarcode:
          barcode

      });


    if (!result.success) {

      throw new Error(
        result.error ||
        "Borrowing failed."
      );

    }


    /*
      Save values before resetting.
    */

    const borrowedStudent =
      result.studentName;

    const borrowedTitle =
      result.bookTitle ||
      "Book";

    const dueDate =
      result.dueDate;


    /*
      RESET FOR NEXT STUDENT
    */

    currentSerial =
      null;

    lastDetectedBarcode =
      null;


    document
      .getElementById("bookBarcode")
      .value =
        "";


    document
      .getElementById("studentFoundBox")
      .style.display =
        "none";


    document
      .getElementById("borrowBox")
      .style.display =
        "none";


    document
      .getElementById("newStudentBox")
      .style.display =
        "none";


    document
      .getElementById("newStudentName")
      .value =
        "";


    document
      .getElementById("displayStudentName")
      .innerText =
        "";


    /*
      NFC reader stays active.
    */

    document
      .getElementById("nfcButton")
      .innerText =
        "📡 NFC Reader Active";


    status.className =
      "success";


    status.innerHTML =
      "✅ <strong>Borrowed!</strong>" +
      "<br>" +
      escapeHtml(borrowedStudent) +
      "<br>" +
      escapeHtml(borrowedTitle) +
      "<br>" +
      "Due: " +
      escapeHtml(dueDate) +
      "<br><br>" +
      "📡 <strong>Ready for next student.</strong>";


    /*
      A small vibration confirms checkout.
    */

    if ("vibrate" in navigator) {

      navigator.vibrate(
        [100, 70, 100]
      );

    }

  }

  catch (error) {

    showError(
      error.message
    );

  }

  finally {

    if (borrowButton) {
      borrowButton.disabled = false;
    }

  }

}


/* =====================================================
   API
===================================================== */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      "Server error: " +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    result.success === false &&
    result.error
  ) {

    throw new Error(
      result.error
    );

  }


  return result;

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  const status =
    document.getElementById("status");


  status.className =
    "error";


  status.innerHTML =
    "❌ " +
    escapeHtml(message);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
