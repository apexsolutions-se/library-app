<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Library NFC Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
      background: #f5f6f8;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      margin-top: 25px;
    }

    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 15px;
      background: #1f4e78;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      line-height: 1.5;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #e8f5e9;
      border-radius: 15px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>📚 Library</h1>
  <h2>NFC Card Test</h2>

  <div class="card">

    <p>
      Press the button, then hold the turnstile
      card against the back of your phone.
    </p>

    <button onclick="scanCard()">
      📡 Scan Student Card
    </button>

    <div id="status">
      Ready to test.
    </div>

    <div id="result"></div>

  </div>


<script>

async function scanCard() {

  const status =
    document.getElementById("status");

  const resultBox =
    document.getElementById("result");


  // Check browser support

  if (!("NDEFReader" in window)) {

    status.innerHTML =
      "❌ Web NFC is not supported by this browser/device.";

    return;
  }


  try {

    status.innerHTML =
      "Starting NFC reader...";


    const ndef =
      new NDEFReader();


    await ndef.scan();


    status.innerHTML =
      "📡 Ready! Hold the card against the back of your phone.";


    ndef.addEventListener(
      "readingerror",
      function() {

        status.innerHTML =
          "⚠️ The phone detected something, but the browser could not read the card.";

      }
    );


    ndef.addEventListener(
      "reading",
      function(event) {

        console.log(event);


        const serialNumber =
          event.serialNumber || "No serial number";


        status.innerHTML =
          "✅ Card detected!";


        let output =
          "<strong>Serial Number:</strong><br>" +
          serialNumber;


        // Try reading NDEF records too

        if (
          event.message &&
          event.message.records
        ) {

          output +=
            "<br><br><strong>Records:</strong><br>";


          for (
            const record of
            event.message.records
          ) {

            try {

              const decoder =
                new TextDecoder(
                  record.encoding || "utf-8"
                );


              output +=
                decoder.decode(record.data) +
                "<br>";

            }

            catch (e) {

              output +=
                "[Record detected]<br>";

            }

          }

        }


        resultBox.innerHTML =
          output;


        resultBox.style.display =
          "block";

      }
    );

  }

  catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ " +
      error.name +
      ": " +
      error.message;

  }

}

</script>

</body>
</html>
