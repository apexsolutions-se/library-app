<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Camera Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: #111;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
    }
  </style>
</head>

<body>

  <h1>📚 Camera Test</h1>

  <p>Press the button below.</p>

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <div id="status"></div>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>


<script>

async function startCamera() {

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("camera");

  status.innerHTML =
    "Requesting camera...";

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });

    video.srcObject = stream;

    status.innerHTML =
      "✅ Camera working!";

  }

  catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ " +
      error.name +
      ": " +
      error.message;

  }

}

</script>

</body>
</html>
